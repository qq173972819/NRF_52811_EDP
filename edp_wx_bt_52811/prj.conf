CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
# GATT device name；实际广播/扫描应答名运行时按 MAC 动态生成为 NRF_EDP_XXXX
CONFIG_BT_DEVICE_NAME="NRF_EDP"
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27
CONFIG_BT_ATT_PREPARE_COUNT=0
# Always-resident: System OFF disabled (this PCB revision has no wake button)
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_FPU=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=256
# RTT 日志后端使用 DROP 模式：缓冲满时丢弃新日志而非阻塞调用者，
# 避免日志输出阻塞 BLE 回调线程导致 GATT 应答超时、链路被断开
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
# nRF52811 has only 24 KiB SRAM. Keep runtime headroom for BLE host state
# and ATT buffers; these values are sufficient for the application threads.
# main 线程仅常驻 idle，让出 256B 给 BT RX 线程：BT RX 承载全部 BLE
# 回调（connected/MTU/params/GATT 服务发现/RX 写/CCC），默认 1024B 栈在
# IMMEDIATE 日志格式化下偏小，栈溢出在无 MPU 时是静默内存破坏。
CONFIG_MAIN_STACK_SIZE=1280
CONFIG_BT_RX_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_CRC=y
